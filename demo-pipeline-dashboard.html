<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trạm quan sát Pipeline · Ngày 10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{--ink:#17211c;--muted:#68736d;--paper:#f4f7f2;--surface:#fff;--line:#d9e1db;--green:#146c43;--green2:#2f9b68;--red:#b33a32;--amber:#ad6a10;--blue:#225f8f;--shadow:0 10px 30px rgba(26,46,35,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;letter-spacing:0;min-height:100vh}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #d99521;outline-offset:3px}
    .shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#14251c;color:#eef7f0;padding:26px 18px 20px;display:flex;flex-direction:column;border-right:1px solid #243b2f}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;border-bottom:1px solid #2b4035}.brand-mark{width:38px;height:38px;display:grid;place-items:center;background:#d9f0df;color:#164a31;border-radius:6px}.brand h1{font-family:Manrope,sans-serif;font-size:15px;line-height:1.2;margin:0}.brand small{color:#a8b9af;font-size:10px;text-transform:uppercase;font-weight:700}
    .nav{display:grid;gap:5px;margin-top:22px}.nav-btn{height:42px;border:0;border-radius:5px;background:transparent;color:#b9c9c0;text-align:left;padding:0 12px;display:flex;align-items:center;gap:11px;cursor:pointer;font-weight:600;font-size:13px}.nav-btn:hover{background:#20382b;color:#fff}.nav-btn.active{background:#e3f2e7;color:#174b32}.nav-btn svg{width:17px}.sidebar-foot{margin-top:auto;border-top:1px solid #2b4035;padding:18px 8px 0}.live-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#c4d4cb}.pulse{width:8px;height:8px;border-radius:50%;background:#4bd286;box-shadow:0 0 0 5px rgba(75,210,134,.12)}.stamp{display:block;color:#82958a;font-size:10px;margin-top:8px}
    .main{min-width:0}.topbar{height:72px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}.top-actions{display:flex;gap:8px}.icon-btn,.present-btn{height:36px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.icon-btn{width:36px}.present-btn{padding:0 13px;font-size:12px;font-weight:700}.icon-btn:hover,.present-btn:hover{border-color:#95a79c;background:#f8faf8}.icon-btn svg,.present-btn svg{width:16px}
    .content{padding:28px 30px 48px;max-width:1500px;margin:auto}.view{display:none}.view.active{display:block;animation:reveal .35s ease both}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:10px;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:1.2px}.page-head h2{font-family:Manrope,sans-serif;font-size:30px;line-height:1.15;margin:6px 0 5px}.page-head p{color:var(--muted);margin:0;font-size:13px}.run-chip{border:1px solid #afd1bb;background:#edf8f0;color:#17623d;border-radius:4px;padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:17px 18px;min-height:116px;box-shadow:0 4px 18px rgba(20,50,32,.035)}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}.metric-icon{width:27px;height:27px;border-radius:4px;display:grid;place-items:center;background:#eef5f0;color:var(--green)}.metric-icon svg{width:15px}.metric-value{font:800 28px Manrope,sans-serif;margin-top:12px}.metric-foot{font-size:11px;color:var(--muted);margin-top:3px}.up{color:var(--green)}.down{color:var(--red)}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow)}.panel-head{height:54px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-title{font:700 13px Manrope,sans-serif;display:flex;align-items:center;gap:8px}.panel-title svg{width:16px;color:var(--green)}.panel-sub{font-size:10px;color:var(--muted)}.panel-body{padding:18px}.overview-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.75fr);gap:14px}
    .flow{display:grid;grid-template-columns:repeat(7,minmax(75px,1fr));align-items:center;gap:8px;padding:18px 4px 8px}.flow-step{position:relative;text-align:center}.flow-step:not(:last-child):after{content:"";position:absolute;top:22px;left:65%;width:78%;height:2px;background:#bed0c3}.node{width:46px;height:46px;border:2px solid #92b59e;background:#eff8f1;border-radius:50%;display:grid;place-items:center;margin:auto;position:relative;z-index:1;color:var(--green)}.node svg{width:19px}.flow-step b{display:block;font-size:10px;margin-top:8px}.flow-step small{font-size:9px;color:var(--muted)}
    .compare-bars{display:grid;gap:18px}.bar-row{display:grid;grid-template-columns:75px 1fr 45px;gap:10px;align-items:center;font-size:11px}.bar-label{font-weight:700}.track{height:9px;background:#edf1ed;border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--green2);transition:width .8s ease}.fill.corrupt{background:var(--red)}.bar-value{text-align:right;font-weight:800}.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-top:18px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}.dot.green{background:var(--green2)}.dot.red{background:var(--red)}
    .table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:11px 13px;border-bottom:1px solid var(--line);background:#f8faf8}.data-table td{padding:13px;border-bottom:1px solid #edf0ed}.data-table tr:last-child td{border-bottom:0}.state{display:inline-flex;align-items:center;gap:6px;font-weight:700}.state:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green2)}.state.bad:before{background:var(--red)}.badge{display:inline-block;border-radius:4px;padding:4px 7px;font-size:10px;font-weight:800}.badge.pass{background:#e5f5e9;color:#17633d}.badge.fail{background:#fbe9e7;color:#9a2e28}
    .signal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quality-card{padding:18px}.quality-head{display:flex;justify-content:space-between;align-items:center}.quality-head h3{font:800 16px Manrope,sans-serif;margin:0}.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 100%,#e6ebe7 0);position:relative}.ring.bad{background:conic-gradient(var(--red) 0 42%,#e6ebe7 42%)}.ring:before{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}.ring span{z-index:1;font:800 11px Manrope}.checks{display:grid;gap:9px;margin-top:17px}.check{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #edf0ed;padding-top:9px}.check span:last-child{font-weight:800}
    .corruption-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:14px}.event-list{display:grid;gap:8px}.event{border:1px solid var(--line);border-left:3px solid var(--red);padding:12px 13px;border-radius:4px;background:#fff}.event-top{display:flex;justify-content:space-between;gap:10px}.event strong{font-size:12px}.event code{font-size:9px;color:var(--muted);word-break:break-all}.event p{font-size:10px;color:var(--muted);margin:7px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.impact{padding:18px}.impact-number{font:800 42px Manrope;color:var(--red);margin:10px 0 0}.impact-delta{font-size:11px;color:var(--muted)}.recovery{margin-top:18px;border-top:1px solid var(--line);padding-top:17px}.recovery strong{color:var(--green);font:800 23px Manrope}
    .agent-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}.agent-status{padding:22px}.agent-avatar{width:58px;height:58px;background:#173d2a;color:#d9f0df;border-radius:7px;display:grid;place-items:center}.agent-avatar svg{width:28px}.agent-status h3{font:800 20px Manrope;margin:18px 0 5px}.agent-status p{font-size:12px;color:var(--muted);line-height:1.6}.config-list{display:grid;gap:9px;margin-top:18px}.config-row{display:flex;justify-content:space-between;font-size:11px;padding-top:9px;border-top:1px solid var(--line)}.config-row b{font-family:monospace}.chat{min-height:480px;display:flex;flex-direction:column}.chat-body{padding:20px;display:grid;gap:14px;max-height:560px;overflow-y:auto;flex:1}.message{max-width:82%;padding:12px 14px;border-radius:6px;font-size:12px;line-height:1.55;white-space:pre-wrap}.message.q{justify-self:end;background:#173d2a;color:#fff}.message.a{background:#edf2ee;border:1px solid #d9e3dc}.message.pending{color:var(--muted);font-style:italic}.message.error{background:#fff0ee;border-color:#e5b2ae;color:#8f2923}.message.empty{max-width:none;text-align:center;padding:80px 20px;background:transparent;color:var(--muted)}.cmd{font-family:monospace;background:#14251c;color:#d7ede0;padding:13px;border-radius:4px;text-align:left;display:block;margin:14px auto 0;max-width:580px;overflow:auto}.agent-form{display:grid;grid-template-columns:1fr 42px;gap:8px;padding:14px;border-top:1px solid var(--line);background:#fafcfa}.agent-input{width:100%;height:42px;border:1px solid #bdc9c0;border-radius:5px;padding:0 13px;background:#fff;color:var(--ink);font:12px "DM Sans",sans-serif}.agent-input:focus{outline:2px solid #5d9975;outline-offset:1px}.agent-send{border:0;border-radius:5px;background:#17613d;color:#fff;display:grid;place-items:center;cursor:pointer}.agent-send:hover{background:#0f4b2e}.agent-send:disabled{opacity:.5;cursor:wait}.agent-send svg{width:17px}
    .presenter{display:none;position:fixed;inset:0;background:#f3f6f1;z-index:50;padding:42px}.presenter.open{display:grid;grid-template-rows:auto 1fr auto}.present-top,.present-bottom{display:flex;justify-content:space-between;align-items:center}.present-top b{font:800 15px Manrope}.slide{display:grid;place-items:center;text-align:center;max-width:980px;margin:auto}.slide h2{font:800 54px/1.08 Manrope;margin:15px 0}.slide p{font-size:20px;color:var(--muted);max-width:780px}.slide-stat{font:800 90px Manrope;color:var(--green)}.slide-stat.red{color:var(--red)}.slide-kicker{text-transform:uppercase;color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.5px}.present-nav{display:flex;gap:8px}.present-nav button{width:42px;height:38px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}.slide-count{font-size:11px;color:var(--muted)}
    .loading{padding:70px;text-align:center;color:var(--muted)}.error-box{border:1px solid #e1aba7;background:#fff3f2;color:#8f2923;padding:14px;border-radius:5px;font-size:12px}.mobile-menu{display:none}
    @media(max-width:1000px){.shell{grid-template-columns:76px 1fr}.sidebar{padding:22px 10px}.brand h1,.brand small,.nav-btn span,.sidebar-foot{display:none}.brand{justify-content:center;padding:0 0 22px}.nav-btn{justify-content:center;padding:0}.metric-grid{grid-template-columns:repeat(2,1fr)}.overview-grid,.corruption-layout,.agent-layout{grid-template-columns:1fr}.signal-grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(4,1fr);row-gap:22px}.flow-step:after{display:none}}
    @media(max-width:620px){.shell{display:block}.sidebar{height:58px;width:100%;position:fixed;z-index:30;bottom:0;top:auto;display:flex;flex-direction:row;padding:7px;border:0;border-top:1px solid #294134}.brand,.sidebar-foot{display:none}.nav{display:flex;margin:0;width:100%;justify-content:space-around}.nav-btn{width:48px;height:43px}.topbar{padding:0 16px}.present-btn span{display:none}.content{padding:20px 14px 82px}.metric-grid{grid-template-columns:1fr 1fr}.metric,.panel{min-width:0}.metric{padding:14px}.page-head{align-items:flex-start;flex-direction:column}.page-head h2{font-size:25px}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.presenter{padding:24px}.slide h2{font-size:36px}.slide-stat{font-size:64px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark"><i data-lucide="activity"></i></div><div><small>Lab ngày 10</small><h1>Trạm quan sát<br>Pipeline</h1></div></div>
      <nav class="nav" aria-label="Điều hướng dashboard">
        <button class="nav-btn active" data-view="overview"><i data-lucide="layout-dashboard"></i><span>Tổng quan</span></button>
        <button class="nav-btn" data-view="quality"><i data-lucide="shield-check"></i><span>Chất lượng</span></button>
        <button class="nav-btn" data-view="corruption"><i data-lucide="triangle-alert"></i><span>Lỗi dữ liệu</span></button>
        <button class="nav-btn" data-view="agent"><i data-lucide="bot"></i><span>Trình diễn Agent</span></button>
      </nav>
      <div class="sidebar-foot"><div class="live-row"><span class="pulse"></span>Đã kết nối dữ liệu</div><span class="stamp" id="checked-at">Đang đọc dữ liệu...</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Pipeline dữ liệu / <b id="crumb-current">Tổng quan</b></div><div class="top-actions"><button class="icon-btn" id="reload" title="Tải lại dữ liệu" aria-label="Tải lại dữ liệu"><i data-lucide="refresh-cw"></i></button><button class="present-btn" id="open-present"><i data-lucide="presentation"></i><span>Trình chiếu</span></button></div></header>
      <div class="content" id="app"><div class="loading">Đang nạp dữ liệu đầu ra...</div></div>
    </main>
  </div>
  <section class="presenter" id="presenter" aria-label="Chế độ trình chiếu">
    <div class="present-top"><b>TRẠM QUAN SÁT PIPELINE</b><button class="icon-btn" id="close-present" title="Đóng trình chiếu" aria-label="Đóng trình chiếu"><i data-lucide="x"></i></button></div>
    <div class="slide" id="slide"></div>
    <div class="present-bottom"><span class="slide-count" id="slide-count"></span><div class="present-nav"><button id="slide-prev" aria-label="Slide trước"><i data-lucide="arrow-left"></i></button><button id="slide-next" aria-label="Slide sau"><i data-lucide="arrow-right"></i></button></div></div>
  </section>
  <script>
    const paths={baselineMetrics:'data/results/baseline_metrics.json',corruptedMetrics:'data/results/corrupted_metrics.json',repairedMetrics:'data/results/repaired_metrics.json',baselineQuality:'data/quality/baseline_quality.json',corruptedQuality:'data/quality/corrupted_quality.json',repairedQuality:'data/quality/repaired_quality.json',baselineFresh:'data/quality/freshness_report.json',corruptedFresh:'data/quality/corrupted_freshness.json',repairedFresh:'data/quality/repaired_freshness.json',corruptionLog:'data/results/corruption_log.json',agent:'data/results/agent_demo_answers.json'};
    let data={},activeView='overview',slideIndex=0,liveMessages=[],agentBusy=false;
    const pct=n=>`${(Number(n||0)*100).toFixed(1)}%`, num=n=>Number(n||0).toFixed(2), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    async function fetchJson(url,optional=false){const r=await fetch(`${url}?t=${Date.now()}`);if(!r.ok){if(optional)return null;throw new Error(`${url}: HTTP ${r.status}`)}return r.json()}
    async function load(){document.getElementById('app').innerHTML='<div class="loading">Đang nạp dữ liệu đầu ra...</div>';try{const entries=await Promise.all(Object.entries(paths).map(async([k,p])=>[k,await fetchJson(p,k==='agent')]));data=Object.fromEntries(entries);render();document.getElementById('checked-at').textContent=`Cập nhật ${new Date().toLocaleTimeString('vi-VN')}`}catch(e){document.getElementById('app').innerHTML=`<div class="error-box"><b>Không đọc được dữ liệu đầu ra.</b><br>${esc(e.message)}<br>Hãy mở trang qua HTTP server, không mở trực tiếp bằng file.</div>`}}
    function metric(label,value,foot,icon,tone=''){return `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon"><i data-lucide="${icon}"></i></span></div><div class="metric-value ${tone}">${value}</div><div class="metric-foot">${foot}</div></article>`}
    function head(kicker,title,sub){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${sub}</p></div><span class="run-chip">ĐÃ KIỂM CHỨNG · CP6</span></div>`}
    function overview(){const b=data.baselineMetrics,c=data.corruptedMetrics,r=data.repairedMetrics;return `<section class="view active">${head('Tổng quan điều hành','Chất lượng dữ liệu quyết định chất lượng RAG','Một pipeline, ba trạng thái, cùng bộ kiểm thử và bộ đánh giá.')}
      <div class="metric-grid">${metric('Tỷ lệ tìm đúng ban đầu',pct(b.retrieval_hit_rate),`${b.samples} mẫu đánh giá`,'target')}${metric('Tỷ lệ khi dữ liệu lỗi',pct(c.retrieval_hit_rate),`${pct(c.retrieval_hit_rate-b.retrieval_hit_rate)} so với ban đầu`,'trending-down','down')}${metric('Tỷ lệ sau khôi phục',pct(r.retrieval_hit_rate),'Khôi phục hoàn toàn','rotate-ccw','up')}${metric('Token F1 sau khôi phục',pct(r.mean_token_f1),`Từ ${pct(c.mean_token_f1)}`,'chart-no-axes-combined','up')}</div>
      <div class="overview-grid"><div class="panel"><div class="panel-head"><div class="panel-title"><i data-lucide="workflow"></i>Pipeline ban đầu</div><span class="panel-sub">THÔ → BÁO CÁO</span></div><div class="panel-body"><div class="flow">${[['database','Dữ liệu thô','24'],['sparkles','Làm sạch','24'],['binary','Mã hóa','MiniLM'],['layers-3','Chroma','24 tài liệu'],['list-checks','Bộ kiểm thử','15'],['scan-search','Đánh giá','4 chỉ số'],['file-chart-column','Báo cáo','ĐẠT']].map(x=>`<div class="flow-step"><div class="node"><i data-lucide="${x[0]}"></i></div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title"><i data-lucide="gauge"></i>Tác động lên truy xuất</div></div><div class="panel-body compare-bars">${bar('Ban đầu',b.retrieval_hit_rate,'')}${bar('Dữ liệu lỗi',c.retrieval_hit_rate,'corrupt')}${bar('Đã khôi phục',r.retrieval_hit_rate,'')}<div class="legend"><span><i class="dot green"></i>Ổn định</span><span><i class="dot red"></i>Suy giảm</span></div></div></div></div>
      <div class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title"><i data-lucide="table-2"></i>Ma trận so sánh</div><span class="panel-sub">CÙNG BỘ KIỂM THỬ · TOP-K · BỘ ĐÁNH GIÁ</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Trạng thái</th><th>Số dòng</th><th>Tìm đúng</th><th>Token F1</th><th>Độ chính xác đánh giá</th><th>Cổng chất lượng</th></tr></thead><tbody>${stateRow('Ban đầu',data.baselineQuality,b)}${stateRow('Dữ liệu lỗi',data.corruptedQuality,c,true)}${stateRow('Đã khôi phục',data.repairedQuality,r)}</tbody></table></div></div></section>`}
    function bar(label,v,cls){return `<div class="bar-row"><span class="bar-label">${label}</span><div class="track"><div class="fill ${cls}" style="width:${v*100}%"></div></div><span class="bar-value">${pct(v)}</span></div>`}
    function qPass(q){return q.success??q.passed??false}function qRows(q){return q.total_rows??q.checks_detail?.row_count?.value??0}
    function stateRow(name,q,m,bad=false){return `<tr><td><span class="state ${bad?'bad':''}">${name}</span></td><td>${qRows(q)}</td><td><b>${pct(m.retrieval_hit_rate)}</b></td><td>${pct(m.mean_token_f1)}</td><td>${pct(m.judge_accuracy)}</td><td><span class="badge ${qPass(q)?'pass':'fail'}">${qPass(q)?'ĐẠT':'KHÔNG ĐẠT'}</span></td></tr>`}
    function qualityCard(name,q,f,bad=false){const checks=[['Số dòng',qRows(q)],['Bản ghi trùng',q.duplicate_count??q.checks_detail?.paper_id_unique?.duplicate_count??0],['Tóm tắt quá ngắn',q.short_summaries??q.checks_detail?.summary_length?.short_count??0],['Bản ghi quá hạn',f.stale_rows??0]];return `<article class="panel quality-card"><div class="quality-head"><div><div class="eyebrow">${name}</div><h3>${qPass(q)?'Dữ liệu ổn định':'Chất lượng suy giảm'}</h3></div><div class="ring ${bad?'bad':''}"><span>${qPass(q)?'ĐẠT':'LỖI'}</span></div></div><div class="checks">${checks.map(x=>`<div class="check"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div></article>`}
    function quality(){return `<section class="view active">${head('Quan sát dữ liệu','Cổng chất lượng qua ba trạng thái','Tín hiệu thay đổi khi dữ liệu lỗi và trở về mức ban đầu sau khôi phục.')}<div class="signal-grid">${qualityCard('Ban đầu',data.baselineQuality,data.baselineFresh)}${qualityCard('Dữ liệu lỗi',data.corruptedQuality,data.corruptedFresh,true)}${qualityCard('Đã khôi phục',data.repairedQuality,data.repairedFresh)}</div><div class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title"><i data-lucide="clock-3"></i>Bằng chứng độ mới dữ liệu</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Trạng thái</th><th>Mới nhất</th><th>Cũ nhất</th><th>Bản ghi quá hạn</th><th>Kết quả</th></tr></thead><tbody>${freshRow('Ban đầu',data.baselineFresh)}${freshRow('Dữ liệu lỗi',data.corruptedFresh,true)}${freshRow('Đã khôi phục',data.repairedFresh)}</tbody></table></div></div></section>`}
    function freshRow(n,f,b=false){return `<tr><td><span class="state ${b?'bad':''}">${n}</span></td><td>${esc(f.latest_published)}</td><td>${esc(f.oldest_published)}</td><td>${f.stale_rows}</td><td><span class="badge ${f.is_fresh?'pass':'fail'}">${f.is_fresh?'MỚI':'QUÁ HẠN'}</span></td></tr>`}
    const corruptionNames={drop_record:'Xóa bản ghi',blank_summary:'Xóa nội dung tóm tắt',noise_summary:'Chèn nhiễu vào tóm tắt',truncate_title:'Cắt ngắn tiêu đề',stale_date:'Làm cũ ngày xuất bản',add_duplicate:'Thêm bản ghi trùng'};
    function corruption(){const log=data.corruptionLog,b=data.baselineMetrics,c=data.corruptedMetrics,r=data.repairedMetrics;return `<section class="view active">${head('Thử nghiệm có kiểm soát','Lỗi dữ liệu có bằng chứng truy vết','Mỗi lỗi đều có mã bản ghi, tham số và giá trị trước/sau rõ ràng.')}<div class="corruption-layout"><div class="panel"><div class="panel-head"><div class="panel-title"><i data-lucide="list-tree"></i>Nhật ký lỗi dữ liệu</div><span class="panel-sub">${log.length} SỰ KIỆN</span></div><div class="panel-body event-list">${log.map(e=>`<article class="event"><div class="event-top"><strong>${esc(corruptionNames[e.type]||e.type.replaceAll('_',' '))}</strong><code>${esc(e.paper_id)}</code></div><p>${esc(String(e.before))} → ${esc(String(e.after))}</p></article>`).join('')}</div></div><aside class="panel impact"><div class="eyebrow">Tác động đo được</div><div class="impact-number">−${pct(b.retrieval_hit_rate-c.retrieval_hit_rate)}</div><div class="impact-delta">tỷ lệ tìm đúng sau khi dữ liệu lỗi</div><div class="recovery"><div class="eyebrow">Khôi phục</div><strong>+${pct(r.retrieval_hit_rate-c.retrieval_hit_rate)}</strong><div class="impact-delta">dựng lại từ bản dữ liệu thô đáng tin cậy</div></div><div class="recovery"><div class="check"><span>Bản ghi bị xóa</span><b>3</b></div><div class="check"><span>Bản ghi trùng thêm vào</span><b>1</b></div><div class="check"><span>Ngày quá hạn</span><b>1</b></div><div class="check"><span>Tóm tắt bị hỏng</span><b>2</b></div></div></aside></div></section>`}
    function agent(){const answers=data.agent;const history=[...(answers||[]),...liveMessages];return `<section class="view active">${head('Agent RAG','Hỏi đáp dựa trên công cụ truy xuất','Agent truy xuất collection ban đầu trước khi trả lời.')}<div class="agent-layout"><aside class="panel agent-status"><div class="agent-avatar"><i data-lucide="bot"></i></div><h3>Agent kho bài báo</h3><p>Tra cứu chính xác và tìm kiếm ngữ nghĩa trên 24 tài liệu Crossref đã làm sạch.</p><div class="config-list"><div class="config-row"><span>Nhà cung cấp</span><b>OpenAI</b></div><div class="config-row"><span>Mô hình</span><b>gpt-4o-mini</b></div><div class="config-row"><span>Kho vector</span><b>papers-baseline</b></div><div class="config-row"><span>Top-k</span><b>4</b></div></div><span class="badge ${answers?'pass':'fail'}" style="margin-top:18px">${answers?'DỮ LIỆU SẴN SÀNG':'CHƯA CHẠY'}</span></aside><div class="panel chat"><div class="panel-head"><div class="panel-title"><i data-lucide="messages-square"></i>Hội thoại với agent</div><span class="panel-sub">DỰA TRÊN CÔNG CỤ</span></div><div class="chat-body" id="chat-body">${history.length?history.map(a=>`<div class="message q">${esc(a.question)}</div><div class="message a ${a.error?'error':''}">${esc(a.answer)}</div>`).join(''):`<div class="message empty"><h3>Đặt câu hỏi đầu tiên</h3><p>Agent sẽ tìm kiếm trong collection ban đầu trước khi trả lời.</p></div>`}${agentBusy?'<div class="message a pending">Agent đang truy xuất tài liệu và tổng hợp câu trả lời...</div>':''}</div><form class="agent-form" id="agent-form"><input class="agent-input" id="agent-input" maxlength="1000" autocomplete="off" placeholder="Nhập câu hỏi về kho bài báo..." aria-label="Câu hỏi cho agent"><button class="agent-send" type="submit" ${agentBusy?'disabled':''} title="Gửi câu hỏi" aria-label="Gửi câu hỏi"><i data-lucide="send"></i></button></form></div></div></section>`}
    const views={overview,quality,corruption,agent};
    function render(){document.getElementById('app').innerHTML=views[activeView]();if(window.lucide)lucide.createIcons();if(activeView==='agent'){const form=document.getElementById('agent-form');if(form)form.onsubmit=askAgent;const body=document.getElementById('chat-body');if(body)body.scrollTop=body.scrollHeight}}
    async function askAgent(event){event.preventDefault();if(agentBusy)return;const input=document.getElementById('agent-input');const question=input.value.trim();if(!question)return;agentBusy=true;input.value='';render();try{const response=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const contentType=response.headers.get('content-type')||'';if(!contentType.includes('application/json'))throw new Error('Trang đang chạy bằng server tĩnh. Hãy mở dashboard tại http://127.0.0.1:8010 để sử dụng Agent.');const payload=await response.json();if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);liveMessages.push({question:payload.question,answer:payload.answer})}catch(error){liveMessages.push({question,answer:error.message,error:true})}finally{agentBusy=false;render();document.getElementById('agent-input')?.focus()}}
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.onclick=()=>{activeView=btn.dataset.view;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===btn));document.getElementById('crumb-current').textContent=btn.textContent.trim();render()});document.getElementById('reload').onclick=load;
    function slides(){return [{k:'Ngày 10 · Quan sát dữ liệu',h:'Chất lượng dữ liệu quyết định chất lượng RAG',p:'Trạng thái ban đầu, lỗi có kiểm soát và khôi phục từ bản dữ liệu thô đáng tin cậy.'},{k:'Trạng thái ban đầu',stat:'100%',h:'Tỷ lệ truy xuất đúng',p:'24 tài liệu sạch · 15 câu hỏi kiểm thử · cổng chất lượng ĐẠT'},{k:'Lỗi có kiểm soát',stat:'80%',red:true,h:'Tỷ lệ truy xuất đúng',p:'22 dòng · bản ghi trùng · ngày quá hạn · tóm tắt hỏng · cổng chất lượng KHÔNG ĐẠT'},{k:'Khôi phục',stat:'100%',h:'Hiệu năng được phục hồi',p:'Dựng lại từ dữ liệu thô, không sửa tay chỉ số. Chất lượng và truy xuất trở về mức ban đầu.'},{k:'Kết luận',h:'Quan sát. Giải thích. Khôi phục.',p:'Bằng chứng từ artifact kết nối lỗi dữ liệu với hiệu năng RAG ở phía sau.'}]}
    function showSlide(){const s=slides()[slideIndex];document.getElementById('slide').innerHTML=`<div><div class="slide-kicker">${s.k}</div>${s.stat?`<div class="slide-stat ${s.red?'red':''}">${s.stat}</div>`:''}<h2>${s.h}</h2><p>${s.p}</p></div>`;document.getElementById('slide-count').textContent=`${slideIndex+1} / ${slides().length}`}
    document.getElementById('open-present').onclick=()=>{document.getElementById('presenter').classList.add('open');slideIndex=0;showSlide()};document.getElementById('close-present').onclick=()=>document.getElementById('presenter').classList.remove('open');document.getElementById('slide-prev').onclick=()=>{slideIndex=Math.max(0,slideIndex-1);showSlide()};document.getElementById('slide-next').onclick=()=>{slideIndex=Math.min(slides().length-1,slideIndex+1);showSlide()};document.addEventListener('keydown',e=>{if(!document.getElementById('presenter').classList.contains('open'))return;if(e.key==='ArrowRight')document.getElementById('slide-next').click();if(e.key==='ArrowLeft')document.getElementById('slide-prev').click();if(e.key==='Escape')document.getElementById('close-present').click()});
    load();if(window.lucide)lucide.createIcons();
  </script>
</body>
</html>
